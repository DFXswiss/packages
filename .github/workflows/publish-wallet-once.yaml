name: Publish wallet once

# Trusted publishing cannot create a package. Run 41621915824 published
# @dfx.swiss/core and @dfx.swiss/react, then returned E404 for @dfx.swiss/wallet.
# This workflow publishes only the already tagged 0.1.1-beta.0. Delete it after.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 6d82995ed55acc605369ebb1a1735ebff1ea8ca6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org

      - name: Install and build
        run: |
          npm ci
          npx lerna run build

      - name: Publish @dfx.swiss/wallet@0.1.1-beta.0
        working-directory: packages/wallet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); if(p.name!=="@dfx.swiss/wallet"||p.version!=="0.1.1-beta.0"){console.error("refusing", p.name, p.version); process.exit(1)}'
          echo "npm user: $(npm whoami)"
          if npm view @dfx.swiss/wallet@0.1.1-beta.0 version >/dev/null 2>&1; then
            echo "already on npm"
          else
            npm publish --access public --tag beta
          fi
          npm view @dfx.swiss/wallet@0.1.1-beta.0 version
          npm view @dfx.swiss/wallet dist-tags --json
