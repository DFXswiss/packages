name: PR CI

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:

env:
  NODE_VERSION: "16.x"

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install packages
        run: |
          npm install

      - name: Determine scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          finish() { echo "mode=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'Full run: not a pull request.'
            finish full
          fi

          if [[ "$BASE" == 'main' ]]; then
            echo 'Full run: pull request targets main.'
            finish full
          fi

          # Exact ci:full via jq on GITHUB_EVENT_PATH (not GitHub contains()).
          # rc 0 = full, 1 = no label, >=2 = fail the step.
          rc=0
          jq -e 'any(.pull_request.labels[]?; .name == "ci:full")' "$GITHUB_EVENT_PATH" >/dev/null || rc=$?
          if (( rc >= 2 )); then
            echo "::error::jq failed while reading pull request labels (exit $rc)."
            exit 1
          fi
          if (( rc == 0 )); then
            echo 'Full run: pull request has the ci:full label.'
            finish full
          fi

          git fetch --quiet origin "$BASE"
          diff_all=$(git diff --no-renames --name-only "origin/$BASE...HEAD")

          # Unsafe paths → full. grep rc 0/1/>=2 like api-pr.yaml.
          # Use a herestring, not a pipe (pipefail + grep -q early-exit can SIGPIPE).
          rc=0
          grep -qv '^[A-Za-z0-9._/-]*$' <<< "$diff_all" || rc=$?
          if (( rc >= 2 )); then
            echo "::error::grep failed while validating changed paths (exit $rc)."
            exit 1
          fi
          if (( rc == 0 )); then
            echo 'Full run: a changed path contains characters outside the safe set A-Za-z0-9._/-.'
            finish full
          fi

          # Infrastructure → full. Root-level only:
          #   lerna.json, package.json, package-lock.json, tsconfig*.json (root),
          #   and any path under .github/workflows/
          # Do NOT treat packages/*/package.json as infrastructure.
          rc=0
          infra=$(grep -E '^(lerna\.json|package\.json|package-lock\.json|tsconfig[^/]*\.json|\.github/workflows/.+)$' <<< "$diff_all") || rc=$?
          if (( rc >= 2 )); then
            echo "::error::grep failed while matching infrastructure paths (exit $rc)."
            exit 1
          fi
          if (( rc == 0 )); then
            echo 'Full run: the PR touches infrastructure:'
            echo "$infra"
            finish full
          fi

          # Any deleted path under packages/ → full (--diff-filter=D).
          # --no-renames is already used above, so a rename is delete+add and hits this too.
          rc=0
          deleted=$(git diff --no-renames --name-only --diff-filter=D "origin/$BASE...HEAD")
          deleted_pkg=$(grep -E '^packages/' <<< "$deleted") || rc=$?
          if (( rc >= 2 )); then
            echo "::error::grep failed while matching deleted files under packages/ (exit $rc)."
            exit 1
          fi
          if (( rc == 0 )); then
            echo 'Full run: the PR deletes files under packages/:'
            echo "$deleted_pkg"
            finish full
          fi

          echo 'Reduced run: Lerna tasks for packages changed since the merge base.'
          finish changed

      - name: Run linter
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = "full" ]; then
            npx lerna run lint
          else
            npx lerna run lint --since "origin/${{ github.base_ref }}"
          fi

      - name: Check formatting
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = "full" ]; then
            npx lerna run format:check
          else
            npx lerna run format:check --since "origin/${{ github.base_ref }}"
          fi

      - name: Build code
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = "full" ]; then
            npx lerna run build
          else
            npx lerna run build --since "origin/${{ github.base_ref }}"
          fi

      - name: Run tests
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = "full" ]; then
            npx lerna run test
          else
            npx lerna run test --since "origin/${{ github.base_ref }}"
          fi
